<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../mi-favicon.svg">
    <title>Interactive & Sortable List</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="main-header">
        <h1>Interactive & Sortable List</h1>
        <p>Dynamically add items via prompt input and remove items using a close button on each list item.</p>
    </header>

    <main class="main-container">
        <a href="../index.html" class="back-link">← Back to Menu</a>
        
        <section class="list-wrapper">
            <div class="input-group">
            <input type="text" id="itemInput" placeholder="Type a new item..." autocomplete="off">
            <button id="addButton" type="button">Add Item</button>
            </div>

            <!-- Empty list ready to receive dynamic li items -->
            <ul id="itemList" class="interactive-list"></ul>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <img src="../mi-favicon.svg" alt="Logo Fer Mamone" class="footer-logo">
            <p>Developed with 💜 by <span>Maria Fernanda Mamone</span></p>
        </div>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
