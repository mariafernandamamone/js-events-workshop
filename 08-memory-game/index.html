<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../mi-favicon.svg">
    <title>Memory Card Game</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="main-header">
        <h1>Memory Card Game</h1>
        <p>A 6x5 grid color-matching memory game with drag-and-drop interaction, mismatch reset, and completion timer.</p>
    </header>

    <main class="main-container">
        <a href="../index.html" class="back-link">← Back to Menu</a>
        
        <section class="memory-container">
            <!-- Game status & timer header -->
            <div class="game-header">
                <span id="pairsCounter" class="status-badge">Pairs: 0 / 15</span>
                <span id="timerDisplay" class="status-badge">Time: 0s</span>
            </div>

            <!-- 6x5 grid populated dynamically via JS -->
            <div id="memoryGrid" class="memory-grid"></div>

            <!-- Victory message & restart -->
            <p id="winMessage" class="win-message"></p>
            <button id="resetBtn" type="button" class="btn-reset">New Game</button>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
            <img src="../mi-favicon.svg" alt="Logo Fer Mamone" class="footer-logo">
            <p>Developed with 💜 by <span>Maria Fernanda Mamone</span></p>
        </div>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
