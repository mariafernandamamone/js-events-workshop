<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 - Keyboard Image Gallery</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <main class="main-container">
        <a href="../index.html" class="back-link">← Back to Menu</a>
        
        <header class="header">
            <h1>01. Keyboard Image Gallery</h1>
            <p>Press any numeric key (0-9) to display its corresponding image. Pressing any other key will clear the container.</p>
        </header>

        <div class="gallery-container" style="display: flex; justify-content: center; align-items: center; margin-top: 2rem;">
            <img id="randomImg" src="" alt="Keyboard Gallery Display" style="display: none; max-width: 350px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1);">
        </div>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
