<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../mi-favicon.svg">
    <title>Keyboard Image Gallery</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="main-header">
        <h1>Keyboard Image Gallery</h1>
        <p>Press any numeric key (0-9) to display its corresponding image. Pressing any other key will clear the container.</p>
    </header>

    <main class="main-container">
        <a href="../index.html" class="back-link">← Back to Menu</a>

        <div class="gallery-container">
            <img id="randomImg" src="" alt="Gallery Display">
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-content">
        <img src="../mi-favicon.svg" alt="Logo Fer Mamone" class="footer-logo">
        <p>Developed with ❤️ by <span>Maria Fernanda Mamone</span></p>
        </div>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
